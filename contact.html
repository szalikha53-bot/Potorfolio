    <!-- ===== CONTACT SECTION (1366 x 650 px) ===== -->
    <main class="container">
        <section class="contact-section">

            <!-- FORM KONTAK (500 x 400 px) -->
            <div class="form-container">
                <h1>Hubungi Saya</h1>
                <form id="contactForm" class="contact-form">
                    <div class="form-group">
                        <label for="nama">Nama</label>
                        <input type="text" id="nama" name="nama" placeholder="Nama" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Email" required>
                    </div>

                    <div class="form-group">
                        <label for="pesan">Pesan</label>
                        <textarea id="pesan" name="pesan" placeholder="Pesan" rows="4" required></textarea>
                    </div>

                    <button type="submit" class="btn-kirim">Kirim Pesan</button>
                </form>
            </div>

            <!-- INFO KONTAK (400 x 300 px) -->
            <div class="info-container">
                <h2>Informasi Kontak</h2>
                <ul class="info-list">
                    <li>
                        <span class="icon">✉️</span>
                        <a href="mailto:sitizalikha06@gmail.com">sitizalikha06@gmail.com</a>
                    </li>
                    <li>
                        <span class="icon">📱</span>

                    </li>
                    <li>
                        <span class="icon">📍</span>
                        <span>Keulibeut, Tumpok Laweung</span>
                    </li>
